<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script/script.js" defer></script>
    <title>Document</title>
</head>

<body>
    <div class="janela-login">
        <h2>Faça seu login</h2>
        <input type="text" id="login-usuario" placeholder="Digite seu login de usuario">
        <input type="password" id="senha-usuario" placeholder="Digite sua senha">
        <button onclick="logar()">Entrar</button>
    </div>
    <div class="janela-cadastro">
        <h2>Faça seu cadastro</h2>
        <input type="text" id="c-login-usuario" placeholder="Digite seu novo login de usuario">
        <input type="password" id="c-senha-usuario" placeholder="Digite sua nova senha">
        <input type="password" id="cr-senha-usuario" placeholder="Repita sua senha">
        <button onclick="criarcadastro()">Cadastrar</button>
    </div>

</body>

</html>
