<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script/script.js" defer></script>
    <title>Document</title>
</head>

<body>
    <div class="janela-buscar-cliente">
        <h2>Busque um cliente</h2>
        <input type="text" id="cpf-cliente" placeholder="Cpf do cliente">
        <button onclick="buscarcliente()">Entrar</button>
    </div>
    <div class="info-cliente">
        <h2>Cliente encontrado:</h2>
        <p>Nome: <span id="info-nome-cliente">Sem informações</span></p>
        <p>Sobrenome: <span id="info-sobrenome-cliente">Sem informações</span></p>
        <p>Idade: <span id="info-idade-cliente">Sem informações</span></p>
        <button onclick="editarcliente()">Editar</button>
        <button onclick="buscarreservas()">buscar reservas</button>
        <div id="lista-de-reservas"></div>
        <div class="janela-fazer-reserva">
            <h2> Fazer reserva</h2>
            <label for="numero-do-quarto">Numero do quarto:</label>
            <input type="number" id="numero-do-quarto-para-reserva" placeholder="numero do quarto">
            <label for="data-entrada">Entrada:</label>
            <input type="date" id="data-entrada">
            <label for="data-saida">Saida:</label>
            <input type="date" id="data-saida">
            <button onclick="reservarquarto()">Reservar quarto</button>
        </div>
    </div>
    <div class="janela-cadastrar-cliente">
        <h2>Cadastre um cliente</h2>
        <input type="text" id="c-cpf-cliente" placeholder="Cpf do cliente">
        <input type="text" id="nome-cliente" placeholder="Nome do cliente">
        <input type="text" id="sobrenome-cliente" placeholder="sobrenome do cliente">
        <input type="number" id="idade-cliente" placeholder="idade do cliente">
        <button onclick="criarcadastrocliente()">Cadastrar</button>
    </div>
    <div class="janela-cadastrar-quarto">
        <h2>Cadastre um quarto</h2>
        <label for="Numeroquarto">Numero do quarto</label>
        <input type="number" id="numero-do-quarto" placeholder="numero do quarto">
        <label for="tipoquarto">Tipo de Quarto</label>
        <select id="tipoquarto">
            <option value="">Selecione...</option>
            <option value="Solteiro">Solteiro</option>
            <option value="Casal">Casal</option>
        </select>
        <label for="valordiaria">Valor da diária</label>
        <input type="number" id="valordiaria" min="0" step="0.01" placeholder="Ex: 250.00">
        <label for="quantidadedecamas">Quantidade de camas</label>
        <input type="number" id="quantidadedecamas" min="1" placeholder="Quantidade de camas">
        <label for="arCondicionado">Ar-condicionado</label>
        <select id="arcondicionado">
            <option value="">Selecione...</option>
            <option value="true">Sim</option>
            <option value="false">Não</option>
        </select>
        <label for="TV">TV</label>
        <select id="TV">
            <option value="">Selecione...</option>
            <option value="true">Sim</option>
            <option value="false">Não</option>
        </select>
        <label for="wifi">Wifi</label>
        <select id="wifi">
            <option value="">Selecione...</option>
            <option value="true">Sim</option>
            <option value="false">Não</option>
        </select>
        <label for="situação">Situação do quarto</label>
        <select id="situação">
            <option value="">Selecione...</option>
            <option value="livre">livre</option>
            <option value="ocupado">ocupado</option>
            <option value="em limpeza">Em limpeza</option>
            <option value="reservador">Reservado</option>
        </select>
        <button onclick="criarcadastroquarto()">Cadastrar</button>
    </div>

</body>

</html>
